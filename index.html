
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像評価実験</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    #image {
      display: block;
      max-width: 100%;
      max-height: 500px;
      margin: 25px auto;
      object-fit: contain;
    }

    #buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    #buttons button {
      font-size: 20px;
      padding: 12px 18px;
      cursor: pointer;
    }

    #status {
      margin: 20px;
    }
  </style>
</head>

<body>
  <h1>画像評価実験</h1>

  <p id="status">画像を準備しています。</p>

  <div id="experiment" hidden>
    <p id="progress"></p>

    <img id="image" alt="評価対象の画像">

    <p>この画像を −3 〜 ＋3 で評価してください。</p>

    <div id="buttons"></div>
  </div>

  <script src="script2.js"></script>
</body>
</html>
